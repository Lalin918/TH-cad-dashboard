<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TH CAD Workflow Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14161f; --ink2:#1d2130; --paper:#f4f5f8; --card:#ffffff; --line:#e7e9f0;
  --text:#1a1d27; --muted:#727a8a; --accent:#ff5a3c; --accent2:#0e9f6e; --info:#3b6fe2; --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;background:var(--paper)}
.mono{font-family:'IBM Plex Mono',monospace;font-size:12px}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;margin:0;letter-spacing:-.01em}
.boot{height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper)}
.spinner{width:34px;height:34px;border:3px solid #d8dbe5;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.app{display:flex;min-height:100vh;background:var(--paper)}
.sidebar{width:248px;flex-shrink:0;background:var(--ink);color:#c7ccda;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px}
.brand-mark{width:42px;height:42px;border-radius:11px;background:var(--accent);color:#fff;font-family:'Bricolage Grotesque';font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;letter-spacing:-.02em}
.brand-name{font-family:'Bricolage Grotesque';font-weight:700;color:#fff;font-size:15px}
.brand-sub{font-size:11px;color:#7e879c}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border:none;background:transparent;color:#aab1c4;border-radius:10px;cursor:pointer;font-size:14px;font-weight:500;text-align:left;width:100%;transition:.15s}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:var(--accent);color:#fff}
.nav-chev{margin-left:auto}
.side-foot{border-top:1px solid rgba(255,255,255,.08);padding-top:14px}
.who{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.who-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#ff5a3c,#ff8a3c);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Bricolage Grotesque'}
.who-avatar.sm{width:26px;height:26px;font-size:12px;display:inline-flex;vertical-align:middle;margin-right:6px}
.who-name{color:#fff;font-size:13px;font-weight:600}
.who-role{font-size:11px;color:#7e879c}
.logout{display:flex;align-items:center;gap:8px;width:100%;justify-content:center;background:rgba(255,255,255,.06);border:none;color:#aab1c4;padding:9px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:500}
.logout:hover{background:rgba(255,255,255,.12);color:#fff}
.main{flex:1;padding:30px 34px;max-width:1500px;min-width:0}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}
.page-title{font-size:27px;font-weight:700}
.page-sub{color:var(--muted);font-size:14px;margin-top:4px}
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;overflow:hidden}
.kpi-bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.kpi-num{font-family:'Bricolage Grotesque';font-weight:800;font-size:34px;line-height:1}
.kpi-label{color:var(--muted);font-size:12.5px;margin-top:7px;font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px}
.card.no-pad{padding:0}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-head h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.link-btn{background:none;border:none;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer}
.link-btn:hover{text-decoration:underline}
.empty{text-align:center;color:var(--muted);padding:30px;font-size:14px}
.att-list{display:flex;flex-direction:column;gap:8px}
.att-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fffdfc}
.att-tick{font-family:'IBM Plex Mono';font-size:12px;color:var(--muted);min-width:62px}
.att-mid{flex:1;min-width:0}
.att-name{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-meta{font-size:11.5px;color:var(--muted)}
.att-due{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted);min-width:74px;justify-content:flex-end}
.att-due.late{color:var(--accent)}
.status-bars{display:flex;flex-direction:column;gap:13px}
.sbar-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;font-weight:500}
.sbar-n{color:var(--muted)}
.sbar-track{height:8px;background:#eef0f4;border-radius:5px;overflow:hidden}
.sbar-fill{height:100%;border-radius:5px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 12px;flex:1;min-width:220px;color:var(--muted)}
.search input{border:none;outline:none;padding:10px 0;font-size:14px;width:100%;background:transparent;color:var(--text);font-family:inherit}
.count{font-size:12.5px;color:var(--muted);margin-left:auto;font-weight:500}
.table-wrap{overflow-x:auto}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table.big{min-width:1100px}
.table th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:13px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbfc;position:sticky;top:0}
.table td{padding:12px;border-bottom:1px solid #f0f2f6;vertical-align:middle;white-space:nowrap}
.table tbody tr:hover{background:#fafbfd}
.table .ellip{max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-urgent{background:#fff6f4 !important}
.row-urgent:hover{background:#fff0ec !important}
.late{color:var(--accent);font-weight:700}
.soon{color:#e8a33d;font-weight:700}
.actions{display:flex;gap:6px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.btn.sm{padding:7px 11px;font-size:12.5px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#ef4a2c}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:#eef0f4;color:var(--text)}
.btn-ghost:hover{background:#e3e6ec}
.btn-block{width:100%;justify-content:center;margin-top:6px}
.icon-btn{background:#f1f3f7;border:none;width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:#e6e9ef;color:var(--text)}
.icon-btn.danger:hover{background:#fde8e6;color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px}
.field-label{font-size:12px;font-weight:600;color:var(--muted)}
.input,.select{border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;font-family:inherit;background:#fff;color:var(--text);outline:none;width:100%}
.input:focus,.select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,90,60,.12)}
.select.sm{width:auto;padding:9px 11px;font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(20,22,31,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.modal{background:#fff;border-radius:18px;width:520px;max-width:100%;max-height:90vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal-wide{width:680px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}
.modal-head h3{font-size:18px;font-weight:700}
.modal-body{padding:22px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.span-2{grid-column:span 2}
.qc-banner{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#faf7f6;border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:18px}
.qc-camp{font-weight:700;font-size:15px;font-family:'Bricolage Grotesque'}
.qc-sub{font-size:12px;color:var(--muted);margin-top:3px}
.qc-dot{display:inline-flex}
.qc-dot.ok{color:var(--accent2)}
.qc-dot.issue{color:#e8a33d}
.qc-dot.none{color:#c4c9d4}
.toggle{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);font-family:inherit}
.toggle.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.vbars{display:flex;align-items:flex-end;gap:10px;padding-top:10px}
.vbar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.vbar-val{font-size:12px;font-weight:700;font-family:'IBM Plex Mono';color:var(--text)}
.vbar-track{width:100%;flex:1;display:flex;align-items:flex-end}
.vbar-fill{width:100%;border-radius:6px 6px 0 0;min-height:3px;transition:height .4s}
.vbar-lbl{font-size:10.5px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;transform:rotate(-12deg);transform-origin:center}
.donut-row{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:9px;flex:1;min-width:140px}
.legend-row{display:flex;align-items:center;gap:9px;font-size:13px}
.legend-dot{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.legend-n{margin-left:auto;color:var(--muted);font-weight:600;font-family:'IBM Plex Mono';font-size:12px}
.login{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.login-art{background:var(--ink);color:#fff;position:relative;overflow:hidden;display:flex;align-items:center;padding:60px}
.login-glow{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(255,90,60,.55),transparent 65%);top:-120px;right:-120px;filter:blur(20px)}
.login-art-inner{position:relative;z-index:1;max-width:420px}
.login-mark{width:54px;height:54px;border-radius:14px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque';font-weight:800;font-size:18px;margin-bottom:30px}
.login-art h1{font-size:42px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.login-art p{color:#aab1c4;font-size:15px;margin-top:16px;line-height:1.6}
.login-points{list-style:none;padding:0;margin:30px 0 0;display:flex;flex-direction:column;gap:13px}
.login-points li{display:flex;align-items:center;gap:11px;font-size:14px;color:#d4d8e2}
.login-points svg{color:var(--accent)}
.login-form{display:flex;align-items:center;justify-content:center;padding:40px;background:var(--paper)}
.login-card{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px;box-shadow:0 10px 40px rgba(20,22,31,.06)}
.login-lock{width:44px;height:44px;border-radius:12px;background:#fff1ee;color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.login-card h2{font-size:24px;font-weight:700}
.login-hint{color:var(--muted);font-size:13.5px;margin:6px 0 22px}
.login-card .field{margin-bottom:14px}
.login-err{background:#fde8e6;color:#c0392b;font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:12px}
.login-demo{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
.login-demo strong{color:var(--text);font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.login-demo code{font-family:'IBM Plex Mono';background:#f1f3f7;padding:1px 6px;border-radius:5px;color:var(--text)}
@media(max-width:1080px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}.login{grid-template-columns:1fr}.login-art{display:none}}
@media(max-width:720px){.sidebar{display:none}.main{padding:18px}.form-grid{grid-template-columns:1fr}.span-2{grid-column:span 1}}
</style>
</head>

const { useState, useEffect, useMemo, useCallback } = React;

/* ---------- Storage: browser localStorage (per device) ---------- */
const store = {
  async get(key){ try{ const v=localStorage.getItem(key); return v?JSON.parse(v):null; }catch(e){ return null; } },
  async set(key,value){ try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){} return true; },
};
const K = { users:"cad_users_v1", reqs:"cad_requests_v1", session:"cad_session_v1" };

/* ---------- Helpers ---------- */
const TODAY = new Date(); TODAY.setHours(0,0,0,0);
function daysLeft(due){ if(!due) return null; const d=new Date(due+"T00:00:00"); return Math.round((d-TODAY)/86400000); }
function fmt(d){ if(!d) return "—"; const dt=new Date(d+"T00:00:00"); return dt.toLocaleDateString("en-GB",{day:"2-digit",month:"short"}); }
function isUrgent(r){
  if(r.status==="Complete"||r.status==="Close by requester") return false;
  if(r.urgency==="Escalated"||r.urgency==="Violated") return true;
  const dl=daysLeft(r.dueDate); return dl!==null && dl<=1;
}
function uid(){ return "r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* ---------- Small UI pieces ---------- */
function Badge({ text, color }){
  if(!text) return <span style={{color:"var(--muted)"}}>—</span>;
  return <span className="badge" style={{ color, background:color+"1f", border:"1px solid "+color+"3a" }}>{text}</span>;
}
function Field({ label, children }){ return <label className="field"><span className="field-label">{label}</span>{children}</label>; }
function Modal({ title, onClose, children, wide }){
  return (
    <div className="overlay" onClick={onClose}>
      <div className={"modal"+(wide?" modal-wide":"")} onClick={(e)=>e.stopPropagation()}>
        <div className="modal-head"><h3>{title}</h3><button className="icon-btn" onClick={onClose}><X size={18}/></button></div>
        <div className="modal-body">{children}</div>
      </div>
    </div>
  );
}

/* ---------- Charts (inline SVG) ---------- */
function VBars({ data, color }){
  const max = Math.max(...data.map(d=>d.value), 1);
  return (
    <div className="vbars" style={{height:240}}>
      {data.map((d,i)=>(
        <div key={i} className="vbar-col">
          <div className="vbar-val">{d.value}</div>
          <div className="vbar-track"><div className="vbar-fill" style={{height:(d.value/max*100)+"%", background:color}}/></div>
          <div className="vbar-lbl" title={d.name}>{d.name}</div>
        </div>
      ))}
    </div>
  );
}
function Donut({ data, colorOf }){
  const total = data.reduce((s,d)=>s+d.value,0) || 1;
  const size=190, thickness=30, r=(size-thickness)/2, c=2*Math.PI*r;
  let offset=0;
  return (
    <div className="donut-row">
      <svg width={size} height={size} viewBox={"0 0 "+size+" "+size}>
        <g transform={"rotate(-90 "+(size/2)+" "+(size/2)+")"}>
          {data.map((d,i)=>{ const len=c*d.value/total; const seg=(<circle key={i} cx={size/2} cy={size/2} r={r} fill="none" stroke={colorOf(d.name,i)} strokeWidth={thickness} strokeDasharray={len+" "+(c-len)} strokeDashoffset={-offset}/>); offset+=len; return seg; })}
        </g>
      </svg>
      <div className="legend">
        {data.map((d,i)=>(
          <div key={i} className="legend-row"><span className="legend-dot" style={{background:colorOf(d.name,i)}}/>{d.name}<span className="legend-n">{d.value}</span></div>
        ))}
      </div>
    </div>
  );
}

/* ====================== App ====================== */
function App(){
  const [ready,setReady]=useState(false);
  const [users,setUsers]=useState([]);
  const [reqs,setReqs]=useState([]);
  const [user,setUser]=useState(null);
  const [view,setView]=useState("dashboard");

  useEffect(()=>{ (async()=>{
    let u=await store.get(K.users); if(!u||!u.length){ u=SEED_USERS; await store.set(K.users,u); }
    let r=await store.get(K.reqs); if(!r){ r=SEED_REQUESTS; await store.set(K.reqs,r); }
    const s=await store.get(K.session);
    setUsers(u); setReqs(r);
    if(s && u.find(x=>x.username===s)) setUser(u.find(x=>x.username===s));
    setReady(true);
  })(); },[]);

  const saveReqs=useCallback(async(next)=>{ setReqs(next); await store.set(K.reqs,next); },[]);
  const saveUsers=useCallback(async(next)=>{ setUsers(next); await store.set(K.users,next); },[]);
  const login=async(u)=>{ setUser(u); await store.set(K.session,u.username); setView("dashboard"); };
  const logout=async()=>{ setUser(null); await store.set(K.session,null); };

  if(!ready) return <div className="boot"><div className="spinner"/></div>;
  if(!user) return <Login users={users} onLogin={login}/>;

  const isManager=user.role==="manager";
  const nav=[
    {id:"dashboard",label:"Dashboard",icon:LayoutDashboard},
    {id:"requests",label:"Requests",icon:ListChecks},
    {id:"qc",label:"QC Form",icon:ClipboardCheck},
    ...(isManager?[{id:"insights",label:"Insights",icon:BarChart3},{id:"team",label:"Team",icon:Users}]:[]),
  ];
  return (
    <div className="app">
      <aside className="sidebar">
        <div className="brand"><div className="brand-mark">CAD</div><div><div className="brand-name">TH CAD</div><div className="brand-sub">Workflow Dashboard</div></div></div>
        <nav className="nav">
          {nav.map(n=>(
            <button key={n.id} className={"nav-item"+(view===n.id?" active":"")} onClick={()=>setView(n.id)}>
              <n.icon size={18}/><span>{n.label}</span>{view===n.id && <ChevronRight size={15} className="nav-chev"/>}
            </button>
          ))}
        </nav>
        <div className="side-foot">
          <div className="who"><div className="who-avatar">{user.name[0]}</div><div><div className="who-name">{user.name}</div><div className="who-role">{isManager?"Manager":"Team · "+user.cad}</div></div></div>
          <button className="logout" onClick={logout}><LogOut size={15}/> Sign out</button>
        </div>
      </aside>
      <main className="main">
        {view==="dashboard" && <Dashboard reqs={reqs} user={user} go={setView}/>}
        {view==="requests" && <Requests reqs={reqs} save={saveReqs} user={user}/>}
        {view==="qc" && <QC reqs={reqs} save={saveReqs} user={user}/>}
        {view==="insights" && isManager && <Insights reqs={reqs}/>}
        {view==="team" && isManager && <Team users={users} save={saveUsers} current={user}/>}
      </main>
    </div>
  );
}

function Requests({ reqs, save, user }){

  const filtered=useMemo(()=>reqs.filter(r=>{
    if(q && !((r.campaign+" "+r.ticketNo+" "+r.brand).toLowerCase().includes(q.toLowerCase()))) return false;
    if(fBrand && r.brand!==fBrand) return false; if(fStatus && r.status!==fStatus) return false;
    if(fUrg && r.urgency!==fUrg) return false; if(fCad && r.cad!==fCad) return false; return true;
  }).sort((a,b)=>(b.date||"").localeCompare(a.date||"")),[reqs,q,fBrand,fStatus,fUrg,fCad]);
  const onSave=(rec)=>{ if(rec.id) save(reqs.map(r=>r.id===rec.id?rec:r)); else save([{...rec,id:uid(),qc:{content:"—",visual:"—",brand:"—",technical:"—",finalCheck:"—",urgentFastLane:false,link:"",reviewDate:""}},...reqs]); setEdit(null); };

              <tr key={r.id}>
                <td className="mono">{r.ticketNo}</td><td className="ellip" title={r.campaign}>{r.campaign}</td><td>{fmt(r.dueDate)}</td><td>{r.reviewBy||"—"}</td>
                <td><QcDot v={qc.content}/></td><td><QcDot v={qc.visual}/></td><td><QcDot v={qc.brand}/></td><td><QcDot v={qc.technical}/></td><td><QcDot v={qc.finalCheck}/></td>
                <td>{qc.urgentFastLane?<Zap size={15} style={{color:"#ff5a3c"}}/>:"—"}</td>
                <td><Badge text={r.reviewOutcome} color={OUTCOME_COLORS[r.reviewOutcome]}/></td>
                <td className="actions"><button className="btn btn-ghost sm" onClick={()=>setOpen(r)}><ClipboardCheck size={14}/> Review</button></td>
              </tr>); })}
          </tbody>
        </table>
      </div></div>
      {open && <QcModal rec={open} user={user} onClose={()=>setOpen(null)} onSave={saveQc}/>}
    </div>
  );
}
function QcDot({ v }){
  if(v==="OK") return <span className="qc-dot ok"><CheckCircle2 size={14}/></span>;
  if(v==="Issue") return <span className="qc-dot issue"><AlertTriangle size={14}/></span>;
  return <span className="qc-dot none">—</span>;
}
function QcModal({ rec, user, onClose, onSave }){
  const [qc,setQc]=useState(rec.qc||{content:"—",visual:"—",brand:"—",technical:"—",finalCheck:"—",urgentFastLane:false,link:"",reviewDate:""});
  const [outcome,setOutcome]=useState(rec.reviewOutcome||""); const [by,setBy]=useState(rec.reviewBy||user.cad||"");
  const setK=(k,v)=>setQc(p=>({...p,[k]:v}));
  const gates=[["content","Content"],["visual","Visual"],["brand","Brand"],["technical","Technical"],["finalCheck","Final check"]];
  return (
    <Modal title={"QC · "+rec.ticketNo} onClose={onClose} wide>
      <div className="qc-banner"><div><div className="qc-camp">{rec.campaign}</div><div className="qc-sub">{rec.brand} · {rec.platform} · {rec.region} · CAD {rec.cad}</div></div><Badge text={rec.urgency} color={URGENCY_COLORS[rec.urgency]}/></div>
      <div className="form-grid">
        {gates.map(([k,label])=>(<Field key={k} label={label}><select className="select" value={qc[k]} onChange={e=>setK(k,e.target.value)}>{OPTIONS.qcCheck.map(o=><option key={o}>{o}</option>)}</select></Field>))}
        <Field label="Urgent fast-lane"><button className={"toggle"+(qc.urgentFastLane?" on":"")} onClick={()=>setK("urgentFastLane",!qc.urgentFastLane)}><Zap size={14}/> {qc.urgentFastLane?"Yes":"No"}</button></Field>
        <Field label="Review date"><input className="input" type="date" value={qc.reviewDate} onChange={e=>setK("reviewDate",e.target.value)}/></Field>
        <Field label="Reviewed by"><select className="select" value={by} onChange={e=>setBy(e.target.value)}><option value="">Select…</option>{OPTIONS.cad.map(b=><option key={b}>{b}</option>)}</select></Field>
        <Field label="Review outcome"><select className="select" value={outcome} onChange={e=>setOutcome(e.target.value)}><option value="">Select…</option>{OPTIONS.reviewOutcome.map(b=><option key={b}>{b}</option>)}</select></Field>
        <div className="span-2"><Field label="Link for check"><input className="input" value={qc.link} onChange={e=>setK("link",e.target.value)} placeholder="https://…"/></Field></div>
      </div>
      <div className="modal-foot"><button className="btn btn-ghost" onClick={onClose}>Cancel</button><button className="btn btn-primary" onClick={()=>onSave({...rec,qc,reviewOutcome:outcome,reviewBy:by})}>Save review</button></div>
    </Modal>
  );
}

/* ---------- Insights ---------- */
function Insights({ reqs }){
  const byKey=(key,opts)=>opts.map(o=>({name:o,value:reqs.filter(r=>r[key]===o).length})).filter(x=>x.value>0);
  const byBrand=byKey("brand",OPTIONS.brand).sort((a,b)=>b.value-a.value).slice(0,8);
  const byCad=byKey("cad",OPTIONS.cad).sort((a,b)=>b.value-a.value);
  const byStatus=byKey("status",OPTIONS.status);
  const byCategory=byKey("category",OPTIONS.category);
  const sla=reqs.filter(r=>r.urgency==="SLA").length;
  const slaRate=reqs.length?Math.round(sla/reqs.length*100):0;
  const cards=[
    {label:"Total requests",value:reqs.length,color:"#1f2a44"},
    {label:"Within SLA",value:slaRate+"%",color:"#0e9f6e"},
    {label:"Escalated",value:reqs.filter(r=>r.urgency==="Escalated").length,color:"#e8a33d"},
    {label:"Violated",value:reqs.filter(r=>r.urgency==="Violated").length,color:"#e23b3b"},
    {label:"Completed",value:reqs.filter(r=>r.status==="Complete").length,color:"#3b6fe2"},
  ];
  const maxBrand=Math.max(...byBrand.map(b=>b.value),1);
  return (
    <div>
      <Header title="Insights" sub="Where the work is coming from and how the team is keeping up."/>
      <div className="kpi-grid">{cards.map(k=>(<div key={k.label} className="kpi"><div className="kpi-bar" style={{background:k.color}}/><div className="kpi-num" style={{color:k.color}}>{k.value}</div><div className="kpi-label">{k.label}</div></div>))}</div>
      <div className="grid-2">
        <div className="card"><div className="card-head"><h3>Workload by CAD</h3></div><VBars data={byCad} color="#ff5a3c"/></div>
        <div className="card"><div className="card-head"><h3>Requests by status</h3></div><Donut data={byStatus} colorOf={(name,i)=>STATUS_COLORS[name]||CHART_PALETTE[i%CHART_PALETTE.length]}/></div>
        <div className="card"><div className="card-head"><h3>Top brands</h3></div>
          <div className="status-bars">{byBrand.map(b=>(<div key={b.name} className="sbar"><div className="sbar-top"><span>{b.name}</span><span className="sbar-n">{b.value}</span></div><div className="sbar-track"><div className="sbar-fill" style={{width:(b.value/maxBrand*100)+"%",background:"#1f2a44"}}/></div></div>))}</div>
        </div>
        <div className="card"><div className="card-head"><h3>Requests by category</h3></div><Donut data={byCategory} colorOf={(name,i)=>CHART_PALETTE[i%CHART_PALETTE.length]}/></div>
      </div>
    </div>
  );
}

/* ---------- Team ---------- */
function Team({ users, save, current }){
  const [add,setAdd]=useState(false);
  const [f,setF]=useState({username:"",name:"",password:"1234",role:"team",cad:""});
  const create=()=>{ if(!f.username||!f.name) return; if(users.find(u=>u.username.toLowerCase()===f.username.toLowerCase())){ window.alert("Username already exists."); return; } save([...users,{...f,username:f.username.toLowerCase()}]); setAdd(false); setF({username:"",name:"",password:"1234",role:"team",cad:""}); };
  const remove=(un)=>{ if(un===current.username){ window.alert("You can't remove your own account."); return; } if(window.confirm("Remove "+un+"?")) save(users.filter(u=>u.username!==un)); };
  return (
    <div>
      <Header title="Team" sub="Manage who can sign in and what role they hold." action={<button className="btn btn-primary" onClick={()=>setAdd(true)}><Plus size={16}/> Add member</button>}/>
      <div className="card no-pad"><div className="table-wrap">
        <table className="table big">
          <thead><tr><th>Name</th><th>Username</th><th>Role</th><th>CAD</th><th></th></tr></thead>
          <tbody>{users.map(u=>(<tr key={u.username}><td><span className="who-avatar sm">{u.name[0]}</span>{u.name}</td><td className="mono">{u.username}</td><td><Badge text={u.role==="manager"?"Manager":"Team"} color={u.role==="manager"?"#ff5a3c":"#3b6fe2"}/></td><td>{u.cad||"—"}</td><td className="actions"><button className="icon-btn danger" onClick={()=>remove(u.username)}><Trash2 size={15}/></button></td></tr>))}</tbody>
        </table>
      </div></div>
      {add && (
        <Modal title="Add team member" onClose={()=>setAdd(false)}>
          <div className="form-grid">
            <Field label="Full name"><input className="input" value={f.name} onChange={e=>setF({...f,name:e.target.value})}/></Field>
            <Field label="Username"><input className="input" value={f.username} onChange={e=>setF({...f,username:e.target.value})} placeholder="lowercase, no spaces"/></Field>
            <Field label="Password"><input className="input" value={f.password} onChange={e=>setF({...f,password:e.target.value})}/></Field>
            <Field label="Role"><select className="select" value={f.role} onChange={e=>setF({...f,role:e.target.value})}><option value="team">Team</option><option value="manager">Manager</option></select></Field>
            <Field label="CAD name"><select className="select" value={f.cad} onChange={e=>setF({...f,cad:e.target.value})}><option value="">Select…</option>{OPTIONS.cad.map(b=><option key={b}>{b}</option>)}</select></Field>
          </div>
          <div className="modal-foot"><button className="btn btn-ghost" onClick={()=>setAdd(false)}>Cancel</button><button className="btn btn-primary" onClick={create}>Add member</button></div>
        </Modal>
      )}
    </div>
  );
}

/* ---------- Header ---------- */
function Header({ title, sub, action }){
  return <div className="page-head"><div><h1 className="page-title">{title}</h1>{sub && <p className="page-sub">{sub}</p>}</div>{action}</div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
