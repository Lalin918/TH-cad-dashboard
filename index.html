<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TH CAD Workflow Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14161f; --ink2:#1d2130; --paper:#f4f5f8; --card:#ffffff; --line:#e7e9f0;
  --text:#1a1d27; --muted:#727a8a; --accent:#ff5a3c; --accent2:#0e9f6e; --info:#3b6fe2; --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;background:var(--paper)}
.mono{font-family:'IBM Plex Mono',monospace;font-size:12px}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;margin:0;letter-spacing:-.01em}
.boot{height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper)}
.spinner{width:34px;height:34px;border:3px solid #d8dbe5;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.app{display:flex;min-height:100vh;background:var(--paper)}
.sidebar{width:248px;flex-shrink:0;background:var(--ink);color:#c7ccda;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px}
.brand-mark{width:42px;height:42px;border-radius:11px;background:var(--accent);color:#fff;font-family:'Bricolage Grotesque';font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;letter-spacing:-.02em}
.brand-name{font-family:'Bricolage Grotesque';font-weight:700;color:#fff;font-size:15px}
.brand-sub{font-size:11px;color:#7e879c}
.nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 13px;border:none;background:transparent;color:#aab1c4;border-radius:10px;cursor:pointer;font-size:14px;font-weight:500;text-align:left;width:100%;transition:.15s}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:var(--accent);color:#fff}
.nav-chev{margin-left:auto}
.side-foot{border-top:1px solid rgba(255,255,255,.08);padding-top:14px}
.who{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.who-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#ff5a3c,#ff8a3c);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Bricolage Grotesque'}
.who-avatar.sm{width:26px;height:26px;font-size:12px;display:inline-flex;vertical-align:middle;margin-right:6px}
.who-name{color:#fff;font-size:13px;font-weight:600}
.who-role{font-size:11px;color:#7e879c}
.logout{display:flex;align-items:center;gap:8px;width:100%;justify-content:center;background:rgba(255,255,255,.06);border:none;color:#aab1c4;padding:9px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:500}
.logout:hover{background:rgba(255,255,255,.12);color:#fff}
.main{flex:1;padding:30px 34px;max-width:1600px;min-width:0}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}
.page-title{font-size:27px;font-weight:700}
.page-sub{color:var(--muted);font-size:14px;margin-top:4px}
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;overflow:hidden;text-align:left;width:100%;cursor:default;font-family:inherit}
.kpi.clickable{cursor:pointer;transition:.15s}
.kpi.clickable:hover{border-color:#c9ccd6;box-shadow:0 6px 18px rgba(20,22,31,.07);transform:translateY(-1px)}
.kpi-bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.kpi-num{font-family:'Bricolage Grotesque';font-weight:800;font-size:34px;line-height:1}
.kpi-label{color:var(--muted);font-size:12.5px;margin-top:7px;font-weight:500}
.kpi-hint{font-size:10.5px;color:#aab1c4;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:18px}
.card.no-pad{padding:0}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.card-head h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.link-btn{background:none;border:none;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer}
.link-btn:hover{text-decoration:underline}
.empty{text-align:center;color:var(--muted);padding:30px;font-size:14px}
.att-list{display:flex;flex-direction:column;gap:8px}
.att-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fffdfc;cursor:pointer}
.att-row:hover{border-color:#f0b9ad}
.att-tick{font-family:'IBM Plex Mono';font-size:12px;color:var(--muted);min-width:62px}
.att-mid{flex:1;min-width:0}
.att-name{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-meta{font-size:11.5px;color:var(--muted)}
.att-due{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted);min-width:74px;justify-content:flex-end}
.att-due.late{color:var(--accent)}
.status-bars{display:flex;flex-direction:column;gap:13px}
.sbar-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;font-weight:500}
.sbar-n{color:var(--muted)}
.sbar-track{height:8px;background:#eef0f4;border-radius:5px;overflow:hidden}
.sbar-fill{height:100%;border-radius:5px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 12px;flex:1;min-width:200px;color:var(--muted)}
.search input{border:none;outline:none;padding:10px 0;font-size:14px;width:100%;background:transparent;color:var(--text);font-family:inherit}
.count{font-size:12.5px;color:var(--muted);margin-left:auto;font-weight:500;white-space:nowrap}
.table-wrap{overflow-x:auto}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table.big{min-width:1180px}
.table th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbfc;position:sticky;top:0}
.table td{padding:8px 10px;border-bottom:1px solid #f0f2f6;vertical-align:middle;white-space:nowrap}
.table tbody tr:hover{background:#fafbfd}
.table .ellip{max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-urgent{background:#fff6f4 !important}
.row-urgent:hover{background:#fff0ec !important}
.late{color:var(--accent);font-weight:700}
.soon{color:#e8a33d;font-weight:700}
.actions{display:flex;gap:6px}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s}
.btn.sm{padding:7px 11px;font-size:12.5px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:#ef4a2c}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:#eef0f4;color:var(--text)}
.btn-ghost:hover{background:#e3e6ec}
.btn-block{width:100%;justify-content:center;margin-top:6px}
.icon-btn{background:#f1f3f7;border:none;width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:#e6e9ef;color:var(--text)}
.icon-btn.danger:hover{background:#fde8e6;color:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px}
.field-label{font-size:12px;font-weight:600;color:var(--muted)}
.input,.select{border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;font-family:inherit;background:#fff;color:var(--text);outline:none;width:100%}
.input:focus,.select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,90,60,.12)}
.input:disabled{background:#f4f5f8;color:var(--muted)}
.select.sm{width:auto;padding:9px 11px;font-size:13px}
.inline-select,.inline-input{border:1px solid transparent;border-radius:7px;padding:5px 7px;font-size:12.5px;font-family:inherit;background:transparent;color:var(--text);outline:none;cursor:pointer;max-width:130px}
.inline-select:hover,.inline-input:hover{background:#f1f3f7}
.inline-select:focus,.inline-input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 2px rgba(255,90,60,.12)}
.inline-input{width:64px;cursor:text}
.overlay{position:fixed;inset:0;background:rgba(20,22,31,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.modal{background:#fff;border-radius:18px;width:520px;max-width:100%;max-height:90vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal-wide{width:700px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:1}
.modal-head h3{font-size:18px;font-weight:700}
.modal-body{padding:22px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.span-2{grid-column:span 2}
.calc-field .input{font-family:'IBM Plex Mono';font-weight:600}
.toggle{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted);font-family:inherit}
.toggle.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.qc-banner{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#faf7f6;border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:18px}
.qc-camp{font-weight:700;font-size:15px;font-family:'Bricolage Grotesque'}
.qc-sub{font-size:12px;color:var(--muted);margin-top:3px}
.qc-dot{display:inline-flex}
.qc-dot.ok{color:var(--accent2)} .qc-dot.issue{color:#e8a33d} .qc-dot.none{color:#c4c9d4}
.vbars{display:flex;align-items:flex-end;gap:10px;padding-top:10px}
.vbar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.vbar-val{font-size:12px;font-weight:700;font-family:'IBM Plex Mono';color:var(--text)}
.vbar-track{width:100%;flex:1;display:flex;align-items:flex-end}
.vbar-fill{width:100%;border-radius:6px 6px 0 0;min-height:3px;transition:height .4s}
.vbar-lbl{font-size:10.5px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.donut-row{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.legend{display:flex;flex-direction:column;gap:9px;flex:1;min-width:140px}
.legend-row{display:flex;align-items:center;gap:9px;font-size:13px}
.legend-dot{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.legend-n{margin-left:auto;color:var(--muted);font-weight:600;font-family:'IBM Plex Mono';font-size:12px}
/* breakdown */
.bd-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.bd{border:1px solid var(--line);border-radius:11px;overflow:hidden}
.bd-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#fff;padding:9px 12px}
.bd-row{display:flex;justify-content:space-between;padding:7px 12px;font-size:13px;border-bottom:1px solid #f2f3f7}
.bd-row:last-child{border-bottom:none}
.bd-row b{font-family:'IBM Plex Mono';font-weight:600}
/* reminder */
.reminder{display:flex;align-items:flex-start;gap:12px;background:#fff6ed;border:1px solid #f4d6b8;border-radius:12px;padding:14px 16px;margin-bottom:18px}
.reminder .rm-ic{color:#e8a33d;flex-shrink:0;margin-top:2px}
.reminder b{display:block;margin-bottom:4px}
.rm-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rm-chip{background:#fff;border:1px solid #f0d3b3;border-radius:7px;padding:4px 9px;font-size:12px;cursor:pointer;font-family:'IBM Plex Mono'}
.rm-chip:hover{background:#fff0dd}
/* timeline */
.tl-legend{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px;font-size:12px;color:var(--muted)}
.tl-legend span{display:inline-flex;align-items:center;gap:6px}
.tl-swatch{width:13px;height:13px;border-radius:3px;display:inline-block}
.tl{border:1px solid var(--line);border-radius:12px;overflow:auto;background:#fff}
.tl-grid{position:relative;min-width:max-content}
.tl-head{display:flex;position:sticky;top:0;z-index:3;background:#fafbfc}
.tl-corner{width:90px;flex-shrink:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);position:sticky;left:0;background:#fafbfc;z-index:4}
.tl-day{flex-shrink:0;text-align:center;border-right:1px solid #f0f2f6;border-bottom:1px solid var(--line);padding:5px 0;font-size:10.5px;color:var(--muted)}
.tl-day .dn{font-weight:700;color:var(--text);font-size:12px;font-family:'IBM Plex Mono'}
.tl-day.we{background:#f6f7fa}
.tl-day.hol{background:#fdecec}
.tl-row{display:flex;border-bottom:1px solid #f0f2f6}
.tl-rh{width:90px;flex-shrink:0;border-right:1px solid var(--line);padding:8px 10px;font-weight:700;font-size:13px;position:sticky;left:0;background:#fff;z-index:2;display:flex;align-items:center}
.tl-lanes{position:relative;flex:1}
.tl-cell{position:absolute;top:0;bottom:0;border-right:1px solid #f4f5f8}
.tl-cell.we{background:#f9fafc}
.tl-cell.hol{background:#fdf0f0}
.tl-bar{position:absolute;height:26px;border-radius:6px;color:#fff;font-size:11px;font-weight:600;padding:0 8px;display:flex;align-items:center;overflow:hidden;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12);white-space:nowrap}
.tl-bar:hover{filter:brightness(1.05);outline:2px solid rgba(0,0,0,.18)}
.tl-bar.miss{outline:2px dashed #e8a33d}
/* config */
.cfg-sec{margin-bottom:14px}
.cfg-sec h4{font-size:13px;font-weight:700;margin:0 0 9px}
.chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:#f1f3f7;border:1px solid var(--line);border-radius:8px;padding:5px 5px 5px 11px;font-size:13px}
.chip button{border:none;background:none;cursor:pointer;color:var(--muted);display:flex;padding:2px;border-radius:5px}
.chip button:hover{background:#e1e4ea;color:var(--accent)}
.chip-add{display:flex;gap:6px}
.chip-add input{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;font-family:inherit;width:150px;outline:none}
.chip-add input:focus{border-color:var(--accent)}
/* login */
.login{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.login-art{background:var(--ink);color:#fff;position:relative;overflow:hidden;display:flex;align-items:center;padding:60px}
.login-glow{position:absolute;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(255,90,60,.55),transparent 65%);top:-120px;right:-120px;filter:blur(20px)}
.login-art-inner{position:relative;z-index:1;max-width:420px}
.login-mark{width:54px;height:54px;border-radius:14px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque';font-weight:800;font-size:18px;margin-bottom:30px}
.login-art h1{font-size:42px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.login-art p{color:#aab1c4;font-size:15px;margin-top:16px;line-height:1.6}
.login-points{list-style:none;padding:0;margin:30px 0 0;display:flex;flex-direction:column;gap:13px}
.login-points li{display:flex;align-items:center;gap:11px;font-size:14px;color:#d4d8e2}
.login-points svg{color:var(--accent)}
.login-form{display:flex;align-items:center;justify-content:center;padding:40px;background:var(--paper)}
.login-card{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:34px;box-shadow:0 10px 40px rgba(20,22,31,.06)}
.login-lock{width:44px;height:44px;border-radius:12px;background:#fff1ee;color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.login-card h2{font-size:24px;font-weight:700}
.login-hint{color:var(--muted);font-size:13.5px;margin:6px 0 22px}
.login-card .field{margin-bottom:14px}
.login-err{background:#fde8e6;color:#c0392b;font-size:13px;padding:9px 12px;border-radius:8px;margin-bottom:12px}
.login-demo{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
.login-demo strong{color:var(--text);font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.login-demo code{font-family:'IBM Plex Mono';background:#f1f3f7;padding:1px 6px;border-radius:5px;color:var(--text)}
.ta{width:100%;min-height:140px;border:1px solid var(--line);border-radius:9px;padding:11px;font-family:'IBM Plex Mono';font-size:12px;outline:none;resize:vertical}
.ta:focus{border-color:var(--accent)}
@media(max-width:1080px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.grid-2,.grid-3,.bd-grid{grid-template-columns:1fr}.login{grid-template-columns:1fr}.login-art{display:none}}
@media(max-width:720px){.sidebar{display:none}.main{padding:18px}.form-grid{grid-template-columns:1fr}.span-2{grid-column:span 1}}
</style>
</head>
<body>
<div id="root"><div class="boot"><div class="spinner"></div></div></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, createContext, useContext } = React;

/* ---------- Inline SVG icons ---------- */
const mkIcon = (inner, fill="none") => ({ size=18, style, className }) =>
  <svg className={className} style={style} width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" dangerouslySetInnerHTML={{ __html: inner }} />;
const LayoutDashboard = mkIcon('<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>');
const ListChecks = mkIcon('<path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/>');
const ClipboardCheck = mkIcon('<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>');
const BarChart3 = mkIcon('<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>');
const Users = mkIcon('<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>');
const LogOut = mkIcon('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>');

/* ================= Team database (online) config =================
   To share data across the whole team, connect a free Supabase project.
   You can either (A) fill the two values below, OR (B) use the in-app
   "Connect team database" button (saved on each device). See README. */
const SUPABASE_URL = "";        // e.g. "https://abcd.supabase.co"
const SUPABASE_ANON_KEY = "";   // the "anon public" key
const SETUP_SQL = `create table if not exists app_state (
  key text primary key,
  value jsonb,
  updated_at timestamptz default now()
);
alter table app_state enable row level security;
do $$ begin
  if not exists (select 1 from pg_policies where tablename='app_state' and policyname='cad_public') then
    create policy "cad_public" on app_state for all using (true) with check (true);
  end if;
end $$;`;

const K={ users:"cad_users_v2", reqs:"cad_requests_v2", session:"cad_session_v2", options:"cad_options_v2", holidays:"cad_holidays_v2" };
const SHARED_KEYS=[K.users,K.reqs,K.options,K.holidays]; // session stays local per device

let MODE="local"; let sb=null;
function getCreds(){
  const url=SUPABASE_URL || (function(){try{return localStorage.getItem("cad_sb_url")||""}catch(e){return ""}})();
  const key=SUPABASE_ANON_KEY || (function(){try{return localStorage.getItem("cad_sb_key")||""}catch(e){return ""}})();
  return {url,key};
}
async function initBackend(){
  const {url,key}=getCreds();
  if(url && key && window.supabase){
    try{
      const client=window.supabase.createClient(url,key);
      const {error}=await client.from("app_state").select("key").limit(1);
      if(error) throw error;
      sb=client; MODE="online"; return true;
    }catch(e){ console.warn("Team DB unavailable, using local mode:", e&&e.message); sb=null; }
  }
  MODE="local"; return false;
}
const store={
  async get(k){
    if(MODE==="online"&&sb){ try{ const {data,error}=await sb.from("app_state").select("value").eq("key",k).maybeSingle(); if(!error) return data?data.value:null; }catch(e){} }
    try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; }
  },
  async set(k,val){
    if(MODE==="online"&&sb){ try{ const {error}=await sb.from("app_state").upsert({key:k,value:val,updated_at:new Date().toISOString()}); if(!error) return true; }catch(e){} }
    try{ localStorage.setItem(k, JSON.stringify(val)); }catch(e){}
    return true;
  },
  localGet(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } },
};

/* ---------- Date helpers ---------- */
const TODAY=new Date(); TODAY.setHours(0,0,0,0);
function isoToDate(iso){ return new Date(iso+"T00:00:00"); }
function addDaysISO(iso,n){ const d=isoToDate(iso); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function daysLeft(due){ if(!due) return null; return Math.round((isoToDate(due)-TODAY)/86400000); }
function fmt(d){ if(!d) return "—"; return isoToDate(d).toLocaleDateString("en-GB",{day:"2-digit",month:"short"}); }
function isWeekendDate(d){ const g=d.getDay(); return g===0||g===6; }
function effStart(r){ return (r.after4pm && r.date) ? addDaysISO(r.date,1) : r.date; }
function recalc(r, holidays){
  const out={...r};
  const s=effStart(r), e=r.dueDate;
  if(!s||!e){ out.workDays=""; out.days=""; return out; }
  const sd=isoToDate(s), ed=isoToDate(e);
  if(ed<sd){ out.workDays=0; out.days=0; return out; }
  const holSet=new Set((holidays||[]).filter(h=>!h.region||h.region==="ALL"||h.region==="Regional"||h.region===r.region).map(h=>h.date));
  out.days=Math.round((ed-sd)/86400000);
  let wd=0; const cur=new Date(sd);
  while(cur<=ed){ const iso=cur.toISOString().slice(0,10); if(!isWeekendDate(cur)&&!holSet.has(iso)) wd++; cur.setDate(cur.getDate()+1); }
  out.workDays=wd; return out;
}
function isUrgent(r){
  if(r.status==="Complete"||r.status==="Close by requester") return false;
  if(r.urgency==="Escalated"||r.urgency==="Violated") return true;
  const dl=daysLeft(r.dueDate); return dl!==null && dl<=1;
}
function isUnfilled(r){ return !r.cad || r.cad==="N/A" || !r.dueDate || !r.pic; }
function uid(){ return "r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

/* ---------- Charts ---------- */
function VBars({data,color}){ const max=Math.max(...data.map(d=>d.value),1); return <div className="vbars" style={{height:240}}>{data.map((d,i)=><div key={i} className="vbar-col"><div className="vbar-val">{d.value}</div><div className="vbar-track"><div className="vbar-fill" style={{height:(d.value/max*100)+"%",background:color}}/></div><div className="vbar-lbl" title={d.name}>{d.name}</div></div>)}</div>; }
function Donut({data,colorOf}){ const total=data.reduce((s,d)=>s+d.value,0)||1; const size=190,th=30,r=(size-th)/2,c=2*Math.PI*r; let off=0; return <div className="donut-row"><svg width={size} height={size} viewBox={"0 0 "+size+" "+size}><g transform={"rotate(-90 "+(size/2)+" "+(size/2)+")"}>{data.map((d,i)=>{const len=c*d.value/total; const seg=<circle key={i} cx={size/2} cy={size/2} r={r} fill="none" stroke={colorOf(d.name,i)} strokeWidth={th} strokeDasharray={len+" "+(c-len)} strokeDashoffset={-off}/>; off+=len; return seg;})}</g></svg><div className="legend">{data.map((d,i)=><div key={i} className="legend-row"><span className="legend-dot" style={{background:colorOf(d.name,i)}}/>{d.name}<span className="legend-n">{d.value}</span></div>)}</div></div>; }

/* ====================== App ====================== */
function App(){
  const [ready,setReady]=useState(false);
  const [users,setUsers]=useState([]);
  const [reqs,setReqs]=useState([]);
  const [options,setOptionsS]=useState(DEFAULT_OPTIONS);
  const [holidays,setHolidaysS]=useState(DEFAULT_HOLIDAYS);
  const [user,setUser]=useState(null);
  const [view,setView]=useState("dashboard");
  const [reqFilter,setReqFilter]=useState(null);
  const [dataMode,setDataMode]=useState("local");
  const [showConnect,setShowConnect]=useState(false);

  const loadAll=useCallback(async()=>{
    let u=await store.get(K.users); if(!u||!u.length){ u=SEED_USERS; await store.set(K.users,u); }
    let o=await store.get(K.options); if(!o){ o=DEFAULT_OPTIONS; await store.set(K.options,o); }
    let h=await store.get(K.holidays); if(!h){ h=DEFAULT_HOLIDAYS; await store.set(K.holidays,h); }
    let r=await store.get(K.reqs); if(!r){ r=SEED_REQUESTS.map(x=>recalc(x,h)); await store.set(K.reqs,r); }
    setUsers(u); setOptionsS(o); setHolidaysS(h); setReqs(r);
    return u;
  },[]);

  useEffect(()=>{(async()=>{
    await initBackend(); setDataMode(MODE);
    const u=await loadAll();
    const s=await store.get(K.session);
    if(s && u.find(x=>x.username===s)) setUser(u.find(x=>x.username===s));
    setReady(true);
  })();},[loadAll]);

  // live sync: re-pull shared data periodically when online
  useEffect(()=>{
    if(dataMode!=="online") return;
    let alive=true;
    const tick=async()=>{
      const [u,o,h,r]=await Promise.all([store.get(K.users),store.get(K.options),store.get(K.holidays),store.get(K.reqs)]);
      if(!alive) return;
      if(u&&JSON.stringify(u)!==JSON.stringify(users)) setUsers(u);
      if(o&&JSON.stringify(o)!==JSON.stringify(options)) setOptionsS(o);
      if(h&&JSON.stringify(h)!==JSON.stringify(holidays)) setHolidaysS(h);
      if(r&&JSON.stringify(r)!==JSON.stringify(reqs)) setReqs(r);
    };
    const id=setInterval(tick,12000);
    return ()=>{ alive=false; clearInterval(id); };
  },[dataMode,users,options,holidays,reqs]);

  const connect=useCallback(async(url,key)=>{
    try{ localStorage.setItem("cad_sb_url",url.trim()); localStorage.setItem("cad_sb_key",key.trim()); }catch(e){}
    const ok=await initBackend(); setDataMode(MODE);
    if(!ok){ window.alert("Could not connect. Please double-check the URL and key, and that you ran the setup SQL."); return false; }
    // push existing local data to the DB for any key that is still empty there
    for(const k of SHARED_KEYS){ const dbVal=await store.get(k); if(dbVal==null){ const lv=store.localGet(k); if(lv!=null) await store.set(k,lv); } }
    await loadAll();
    setShowConnect(false);
    return true;
  },[loadAll]);

  const saveReqs=useCallback(async(n)=>{ setReqs(n); await store.set(K.reqs,n); },[]);
  const saveUsers=useCallback(async(n)=>{ setUsers(n); await store.set(K.users,n); },[]);
  const setOptions=useCallback(async(n)=>{ setOptionsS(n); await store.set(K.options,n); },[]);
  const setHolidays=useCallback(async(n)=>{ setHolidaysS(n); await store.set(K.holidays,n); },[]);
  const login=async(u)=>{ setUser(u); await store.set(K.session,u.username); setView("dashboard"); };
  const logout=async()=>{ setUser(null); await store.set(K.session,null); };
  const go=(v,filter)=>{ setReqFilter(filter||null); setView(v); };

  if(!ready) return <div className="boot"><div className="spinner"/></div>;
  if(!user) return <Ctx.Provider value={{options,holidays}}>
    <Login users={users} onLogin={login} dataMode={dataMode} onConnect={()=>setShowConnect(true)}/>
    {showConnect && <ConnectModal onClose={()=>setShowConnect(false)} onConnect={connect}/>}
  </Ctx.Provider>;

  const isMgr=user.role==="manager";
  const nav=[
    {id:"dashboard",label:"Dashboard",icon:LayoutDashboard},
    ...(isMgr?[{id:"timeline",label:"Timeline",icon:CalendarRange}]:[]),
    {id:"requests",label:"Requests",icon:ListChecks},
    {id:"qc",label:"QC Form",icon:ClipboardCheck},
    ...(isMgr?[{id:"insights",label:"Insights",icon:BarChart3},{id:"team",label:"Team",icon:Users},{id:"config",label:"Config",icon:Sliders}]:[]),
  ];

  return (
    <Ctx.Provider value={{options,setOptions,holidays,setHolidays,reqs,saveReqs,users,saveUsers,user,go}}>
      <div className="app">
        <aside className="sidebar">
          <div className="brand"><div className="brand-mark">CAD</div><div><div className="brand-name">TH CAD</div><div className="brand-sub">Workflow Dashboard</div></div></div>
          <nav className="nav">{nav.map(n=><button key={n.id} className={"nav-item"+(view===n.id?" active":"")} onClick={()=>go(n.id)}><n.icon size={18}/><span>{n.label}</span>{view===n.id&&<ChevronRight size={15} className="nav-chev"/>}</button>)}</nav>
          <div className="side-foot">
            <div className={"sync-pill "+(dataMode==="online"?"on":"off")} onClick={()=>setShowConnect(true)} title="Team database">
              <span className="sync-dot"/>{dataMode==="online"?"Online · team synced":"Local only · connect"}
            </div>
            <div className="who"><div className="who-avatar">{user.name[0]}</div><div><div className="who-name">{user.name}</div><div className="who-role">{isMgr?"Manager":"Team · "+user.cad}</div></div></div><button className="logout" onClick={logout}><LogOut size={15}/> Sign out</button>
          </div>
        </aside>
        <main className="main">
          {view==="dashboard" && <Dashboard/>}
          {view==="timeline" && isMgr && <Timeline/>}
          {view==="requests" && <Requests initialFilter={reqFilter} clearInitial={()=>setReqFilter(null)}/>}
          {view==="qc" && <QC/>}
          {view==="insights" && isMgr && <Insights/>}
          {view==="team" && isMgr && <Team/>}
          {view==="config" && isMgr && <Config/>}
        </main>
      </div>
      {showConnect && <ConnectModal onClose={()=>setShowConnect(false)} onConnect={connect}/>}
    </Ctx.Provider>
  );
}

/* ---------- Login ---------- */
function Login({users,onLogin,dataMode,onConnect}){
  const [u,setU]=useState(""),[p,setP]=useState(""),[err,setErr]=useState("");
  const submit=()=>{ const f=users.find(x=>x.username.toLowerCase()===u.trim().toLowerCase()&&x.password===p); if(f) onLogin(f); else setErr("Incorrect username or password."); };

/* ---------- Timeline (manager) ---------- */
function Timeline(){
  const { reqs,holidays,go }=useApp();
  const regions=["SG","PH","MY","TH","ID","Regional"];
  const unfilled=reqs.filter(isUnfilled);
  // window
  const valid=reqs.filter(r=>r.date&&r.dueDate);
  let start,end;
  if(valid.length){
    start=valid.map(r=>effStart(r)).sort()[0];
    end=valid.map(r=>r.dueDate).sort().slice(-1)[0];
  } else { start=TODAY.toISOString().slice(0,10); end=addDaysISO(start,14); }
  // clamp width
  if(Math.round((isoToDate(end)-isoToDate(start))/86400000)>80){ start=addDaysISO(TODAY.toISOString().slice(0,10),-10); end=addDaysISO(start,50); }
  const days=[]; { let c=isoToDate(start); const ed=isoToDate(end); while(c<=ed){ days.push(c.toISOString().slice(0,10)); c.setDate(c.getDate()+1); } }
  const COL=46, BAR=30;
  const holByDate=(iso,region)=>holidays.find(h=>h.date===iso&&(!h.region||h.region==="ALL"||h.region==="Regional"||h.region===region));
  const idxOf=(iso)=>days.indexOf(iso);

  const rowFor=(region)=>{
    const items=reqs.filter(r=>r.region===region&&r.date&&r.dueDate).map(r=>{ const s=effStart(r); let si=idxOf(s), ei=idxOf(r.dueDate); if(si<0&&isoToDate(s)<isoToDate(start)) si=0; if(ei<0&&isoToDate(r.dueDate)>isoToDate(end)) ei=days.length-1; if(si<0||ei<0) return null; return {r,si,ei:Math.max(ei,si)}; }).filter(Boolean).sort((a,b)=>a.si-b.si);
    const lanes=[];
    items.forEach(it=>{ let placed=false; for(const lane of lanes){ if(lane[lane.length-1].ei<it.si){ lane.push(it); placed=true; break; } } if(!placed) lanes.push([it]); });
    return lanes;
  };

  return <div>
    <Header title="Team Timeline" sub="KV creation requests across regions — synced live from the request list."/>
    {unfilled.length>0 && <div className="reminder"><Bell size={18} className="rm-ic"/><div><b>Reminder · {unfilled.length} request{unfilled.length>1?"s":""} not filled in yet</b><span style={{fontSize:13,color:"#8a6a3a"}}>Missing assignee, due date, or requester. Click to complete the details.</span><div className="rm-list">{unfilled.map(r=><span key={r.id} className="rm-chip" onClick={()=>go("requests",{search:r.ticketNo})}>{r.ticketNo} · {r.brand}</span>)}</div></div></div>}
    <div className="tl-legend">
      {["6.6 Teasing","6.6 D-Day","6.6 After Party","Brand day","Midmonth","BAU"].map(c=><span key={c}><span className="tl-swatch" style={{background:catColor(c)}}/>{c}</span>)}
      <span><span className="tl-swatch" style={{background:"#f6f7fa",border:"1px solid #e0e3ea"}}/>Weekend</span>
      <span><span className="tl-swatch" style={{background:"#fdecec",border:"1px solid #f3c9c9"}}/>Public holiday</span>
      <span><span className="tl-swatch" style={{background:"#fff",border:"2px dashed #e8a33d"}}/>Not filled in</span>
    </div>
    <div className="tl"><div className="tl-grid">
      <div className="tl-head"><div className="tl-corner" style={{height:42}}/>{days.map(d=>{const dt=isoToDate(d); const we=isWeekendDate(dt); const hol=holByDate(d); return <div key={d} className={"tl-day"+(hol?" hol":we?" we":"")} style={{width:COL}}><div>{dt.toLocaleDateString("en-US",{weekday:"short"}).slice(0,2)}</div><div className="dn">{dt.getDate()}/{dt.getMonth()+1}</div></div>;})}</div>
      {regions.map(region=>{ const lanes=rowFor(region); const h=Math.max(lanes.length,1)*(BAR+6)+10; return <div key={region} className="tl-row"><div className="tl-rh" style={{height:h}}>{region}</div><div className="tl-lanes" style={{height:h,width:days.length*COL}}>
        {days.map((d,i)=>{const dt=isoToDate(d); const we=isWeekendDate(dt); const hol=holByDate(d,region); return <div key={d} className={"tl-cell"+(hol?" hol":we?" we":"")} style={{left:i*COL,width:COL}}/>;})}
        {lanes.map((lane,li)=>lane.map(it=>{const left=it.si*COL+3, width=(it.ei-it.si+1)*COL-6; const miss=isUnfilled(it.r); return <div key={it.r.id} className={"tl-bar"+(miss?" miss":"")} style={{left,width:Math.max(width,COL-6),top:li*(BAR+6)+6,height:BAR,background:catColor(it.r.category)}} title={it.r.ticketNo+" · "+it.r.campaign+" ("+(it.r.cad||"unassigned")+")"} onClick={()=>go("requests",{search:it.r.ticketNo})}>{it.r.campaign}</div>;}))}
      </div></div>;})}
    </div></div>
  </div>;
}

/* ---------- Requests ---------- */
const BLANK={ ticketNo:"",date:"",brand:"",campaign:"",category:"",urgency:"SLA",dueDate:"",after4pm:false,workDays:"",days:"",revisionDate:"",pic:"",cad:"",platform:"",region:"",status:"Open",output:"",reviewOutcome:"",reviewBy:"" };
function Requests({initialFilter,clearInitial}){
  const { reqs,saveReqs,holidays,options,user }=useApp();
  const OPTIONS=options; const isMgr=user.role==="manager";
  const [q,setQ]=useState(""),[fBrand,setFB]=useState(""),[fStatus,setFS]=useState(""),[fUrg,setFU]=useState(""),[fCad,setFC]=useState(""),[fRegion,setFR]=useState(""),[fPlat,setFP]=useState(""),[fCat,setFCat]=useState(""),[urgentOnly,setUO]=useState(false);
  const [edit,setEdit]=useState(null),[bulk,setBulk]=useState(false);

  useEffect(()=>{ if(initialFilter){ setQ(initialFilter.search||""); setFB(initialFilter.brand||""); setFS(initialFilter.status||""); setFU(initialFilter.urgency||""); setFC(initialFilter.cad||""); setFR(initialFilter.region||""); setFP(initialFilter.platform||""); setFCat(initialFilter.category||""); setUO(!!initialFilter.urgentOnly); clearInitial&&clearInitial(); } },[initialFilter]);

  const filtered=useMemo(()=>reqs.filter(r=>{
    if(q&&!((r.campaign+" "+r.ticketNo+" "+r.brand).toLowerCase().includes(q.toLowerCase()))) return false;
    if(fBrand&&r.brand!==fBrand) return false; if(fStatus&&r.status!==fStatus) return false; if(fUrg&&r.urgency!==fUrg) return false;
    if(fCad&&r.cad!==fCad) return false; if(fRegion&&r.region!==fRegion) return false; if(fPlat&&r.platform!==fPlat) return false; if(fCat&&r.category!==fCat) return false;
    if(urgentOnly&&!isUrgent(r)) return false; return true;
  }).sort((a,b)=>(b.date||"").localeCompare(a.date||"")),[reqs,q,fBrand,fStatus,fUrg,fCad,fRegion,fPlat,fCat,urgentOnly]);

  const patch=(id,changes)=>saveReqs(reqs.map(r=>r.id===id?recalc({...r,...changes},holidays):r));
  const onSave=(rec)=>{ const r2=recalc(rec,holidays); if(rec.id) saveReqs(reqs.map(r=>r.id===rec.id?r2:r)); else saveReqs([{...r2,id:uid(),qc:{content:"—",visual:"—",brand:"—",technical:"—",finalCheck:"—",urgentFastLane:false,link:"",reviewDate:""}},...reqs]); setEdit(null); };
  const onDelete=(id)=>{ if(window.confirm("Delete this request?")) saveReqs(reqs.filter(r=>r.id!==id)); };
  const onBulk=(rows)=>{ const recs=rows.map(x=>recalc({...BLANK,...x,id:uid(),qc:{content:"—",visual:"—",brand:"—",technical:"—",finalCheck:"—",urgentFastLane:false,link:"",reviewDate:""}},holidays)); saveReqs([...recs,...reqs]); setBulk(false); };
  const clearAll=()=>{ setQ("");setFB("");setFS("");setFU("");setFC("");setFR("");setFP("");setFCat("");setUO(false); };
  const anyFilter=q||fBrand||fStatus||fUrg||fCad||fRegion||fPlat||fCat||urgentOnly;

  return <div>
    <Header title="Requests" sub="All work coming in — filter, edit inline, or bulk import." action={<div style={{display:"flex",gap:8}}><button className="btn btn-ghost" onClick={()=>setBulk(true)}><Upload size={16}/> Bulk upload</button><button className="btn btn-primary" onClick={()=>setEdit({...BLANK})}><Plus size={16}/> New request</button></div>}/>
    <div className="toolbar">
      <div className="search"><Search size={16}/><input placeholder="Search campaign, ticket, brand…" value={q} onChange={e=>setQ(e.target.value)}/></div>
      <select className="select sm" value={fBrand} onChange={e=>setFB(e.target.value)}><option value="">All brands</option>{OPTIONS.brand.map(b=><option key={b}>{b}</option>)}</select>
      <select className="select sm" value={fCat} onChange={e=>setFCat(e.target.value)}><option value="">All category</option>{OPTIONS.category.map(b=><option key={b}>{b}</option>)}</select>
      <select className="select sm" value={fCad} onChange={e=>setFC(e.target.value)}><option value="">All CAD</option>{OPTIONS.cad.map(b=><option key={b}>{b}</option>)}</select>
      <select className="select sm" value={fRegion} onChange={e=>setFR(e.target.value)}><option value="">All region</option>{OPTIONS.region.map(b=><option key={b}>{b}</option>)}</select>
      <select className="select sm" value={fPlat} onChange={e=>setFP(e.target.value)}><option value="">All platform</option>{OPTIONS.platform.map(b=><option key={b}>{b}</option>)}</select>
      <select className="select sm" value={fStatus} onChange={e=>setFS(e.target.value)}><option value="">All status</option>{OPTIONS.status.map(b=><option key={b}>{b}</option>)}</select>
      <select className="select sm" value={fUrg} onChange={e=>setFU(e.target.value)}><option value="">All urgency</option>{OPTIONS.urgency.map(b=><option key={b}>{b}</option>)}</select>
      <button className={"toggle"+(urgentOnly?" on":"")} onClick={()=>setUO(!urgentOnly)} style={{padding:"8px 12px"}}><Zap size={14}/> Urgent</button>
      {anyFilter&&<button className="link-btn" onClick={clearAll}>Clear</button>}
      <span className="count">{filtered.length} of {reqs.length}</span>
    </div>
    <div className="card no-pad"><div className="table-wrap"><table className="table big">
      <thead><tr><th>Ticket</th><th>Date</th><th>Brand</th><th>Campaign</th><th>Category</th><th>Urgency</th><th>Due</th><th>WD</th><th>Days</th><th>Left</th><th>PIC</th><th>CAD</th><th>Platform</th><th>Region</th><th>Status</th><th>Output</th><th>Outcome</th><th></th></tr></thead>
      <tbody>{filtered.map(r=>{const dl=daysLeft(r.dueDate); return <tr key={r.id} className={isUrgent(r)?"row-urgent":""}>

        <td><InlineSelect value={r.reviewOutcome} opts={OPTIONS.reviewOutcome} onChange={v=>patch(r.id,{reviewOutcome:v})} color={OUTCOME_COLORS[r.reviewOutcome]}/></td>
        <td className="actions"><button className="icon-btn" onClick={()=>setEdit(r)} title="Edit all"><Pencil size={14}/></button>{isMgr&&<button className="icon-btn danger" onClick={()=>onDelete(r.id)}><Trash2 size={14}/></button>}</td>
      </tr>;})}{filtered.length===0&&<tr><td colSpan={18} className="empty">No requests match your filters.</td></tr>}</tbody>
    </table></div></div>
    {edit&&<RequestModal rec={edit} onClose={()=>setEdit(null)} onSave={onSave}/>}
    {bulk&&<BulkModal onClose={()=>setBulk(false)} onImport={onBulk}/>}
  </div>;
}

function RequestModal({rec,onClose,onSave}){
  const { options:OPTIONS,holidays }=useApp();
  const [f,setF]=useState(rec); const set=(k,v)=>setF(p=>({...p,[k]:v}));
  const calc=useMemo(()=>recalc(f,holidays),[f.date,f.dueDate,f.after4pm,f.region,holidays]);
  const valid=f.campaign&&f.brand;
  return <Modal title={rec.id?"Edit request":"New request"} onClose={onClose} wide>
    <div className="form-grid">
      <Field label="Ticket No"><input className="input" value={f.ticketNo} onChange={e=>set("ticketNo",e.target.value)} placeholder="#67600"/></Field>
      <Field label="Request date"><input className="input" type="date" value={f.date} onChange={e=>set("date",e.target.value)}/></Field>
      <Field label="Brand *"><select className="select" value={f.brand} onChange={e=>set("brand",e.target.value)}><option value="">Select…</option>{OPTIONS.brand.map(b=><option key={b}>{b}</option>)}</select></Field>
      <Field label="Category"><select className="select" value={f.category} onChange={e=>set("category",e.target.value)}><option value="">Select…</option>{OPTIONS.category.map(b=><option key={b}>{b}</option>)}</select></Field>
      <div className="span-2"><Field label="Campaign *"><input className="input" value={f.campaign} onChange={e=>set("campaign",e.target.value)} placeholder="Campaign name"/></Field></div>
      <div className="span-2"><label className="field"><span className="field-label">SLA timing</span><button className={"toggle"+(f.after4pm?" on":"")} onClick={()=>set("after4pm",!f.after4pm)} type="button"><CalendarClock size={14}/> {f.after4pm?"Submitted after 4 PM — counts as next working day":"Submitted before 4 PM"}</button></label></div>
      <Field label="Urgency"><select className="select" value={f.urgency} onChange={e=>set("urgency",e.target.value)}>{OPTIONS.urgency.map(b=><option key={b}>{b}</option>)}</select></Field>
      <Field label="Due date"><input className="input" type="date" value={f.dueDate} onChange={e=>set("dueDate",e.target.value)}/></Field>
      <div className="calc-field"><Field label="Work days (auto)"><input className="input" disabled value={calc.workDays===""?"—":calc.workDays}/></Field></div>
      <div className="calc-field"><Field label="Days (auto)"><input className="input" disabled value={calc.days===""?"—":calc.days}/></Field></div>
      <Field label="PIC (requester)"><select className="select" value={f.pic} onChange={e=>set("pic",e.target.value)}><option value="">Select…</option>{OPTIONS.pic.map(b=><option key={b}>{b}</option>)}</select></Field>
      <Field label="CAD (assignee)"><select className="select" value={f.cad} onChange={e=>set("cad",e.target.value)}><option value="">Select…</option>{OPTIONS.cad.map(b=><option key={b}>{b}</option>)}</select></Field>
      <Field label="Platform"><select className="select" value={f.platform} onChange={e=>set("platform",e.target.value)}><option value="">Select…</option>{OPTIONS.platform.map(b=><option key={b}>{b}</option>)}</select></Field>
      <Field label="Region"><select className="select" value={f.region} onChange={e=>set("region",e.target.value)}><option value="">Select…</option>{OPTIONS.region.map(b=><option key={b}>{b}</option>)}</select></Field>
      <Field label="Status"><select className="select" value={f.status} onChange={e=>set("status",e.target.value)}>{OPTIONS.status.map(b=><option key={b}>{b}</option>)}</select></Field>
      <Field label="Total output"><input className="input" value={f.output} onChange={e=>set("output",e.target.value)} placeholder="e.g. 8"/></Field>
    </div>
    <div className="modal-foot"><button className="btn btn-ghost" onClick={onClose}>Cancel</button><button className="btn btn-primary" disabled={!valid} onClick={()=>onSave({...f,...recalc(f,holidays)})}>{rec.id?"Save changes":"Create request"}</button></div>
  </Modal>;
}

function BulkModal({onClose,onImport}){
  const HEADERS=["ticketNo","date","brand","campaign","category","urgency","dueDate","pic","cad","platform","region","status","output"];
  const [text,setText]=useState("");
  const parsed=useMemo(()=>{
    const lines=text.trim().split(/\r?\n/).filter(l=>l.trim());
    if(lines.length<2) return [];
    const head=lines[0].split(",").map(s=>s.trim().toLowerCase());
    const map=HEADERS.map(h=>head.findIndex(x=>x===h.toLowerCase()||x===h.replace(/([A-Z])/g," $1").trim().toLowerCase()));
    return lines.slice(1).map(line=>{ const c=line.split(",").map(s=>s.trim()); const o={}; HEADERS.forEach((h,i)=>{ const idx=map[i]; o[h]= idx>=0? (c[idx]||"") : ""; }); if(o.ticketNo&&!o.ticketNo.startsWith("#")) o.ticketNo="#"+o.ticketNo; return o; }).filter(o=>o.campaign||o.ticketNo);
  },[text]);
  const template=HEADERS.join(",")+"\n#67601,2026-06-10,NIKE,Sample campaign,BAU,SLA,2026-06-12,Beam-CDM,Latin,SHP,TH,Open,2";
  const dl=()=>{ const b=new Blob([template],{type:"text/csv"}); const u=URL.createObjectURL(b); const a=document.createElement("a"); a.href=u; a.download="cad_bulk_template.csv"; a.click(); URL.revokeObjectURL(u); };
  const onFile=(e)=>{ const file=e.target.files[0]; if(!file) return; const rd=new FileReader(); rd.onload=()=>setText(String(rd.result)); rd.readAsText(file); };
  return <Modal title="Bulk upload requests" onClose={onClose} wide>
    <p style={{fontSize:13,color:"var(--muted)",marginTop:0}}>Paste CSV rows or upload a .csv file. First line must be the header. Columns: {HEADERS.join(", ")}.</p>
    <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}><button className="btn btn-ghost sm" onClick={dl}><Upload size={14}/> Download template</button><label className="btn btn-ghost sm" style={{cursor:"pointer"}}>Choose .csv file<input type="file" accept=".csv,text/csv" style={{display:"none"}} onChange={onFile}/></label></div>
    <textarea className="ta" value={text} onChange={e=>setText(e.target.value)} placeholder={template}/>
    <div style={{margin:"10px 0",fontSize:13,fontWeight:600,color:parsed.length?"var(--accent2)":"var(--muted)"}}>{parsed.length?("Ready to import "+parsed.length+" request"+(parsed.length>1?"s":"")):"Paste data to preview"}</div>
    <div className="modal-foot"><button className="btn btn-ghost" onClick={onClose}>Cancel</button><button className="btn btn-primary" disabled={!parsed.length} onClick={()=>onImport(parsed)}>Import {parsed.length||""}</button></div>
  </Modal>;
}

/* ---------- QC ---------- */
function QC(){
  const { reqs,saveReqs,options }=useApp();
  const OPTIONS=options;
  const [q,setQ]=useState(""),[fOut,setFO]=useState(""),[fBy,setFBy]=useState(""),[fFast,setFF]=useState(false),[open,setOpen]=useState(null);
  const filtered=useMemo(()=>reqs.filter(r=>{ if(q&&!((r.campaign+" "+r.ticketNo).toLowerCase().includes(q.toLowerCase()))) return false; if(fOut&&r.reviewOutcome!==fOut) return false; if(fBy&&r.reviewBy!==fBy) return false; if(fFast&&!(r.qc&&r.qc.urgentFastLane)) return false; return true; }).sort((a,b)=>(b.date||"").localeCompare(a.date||"")),[reqs,q,fOut,fBy,fFast]);
  const patch=(id,changes)=>saveReqs(reqs.map(r=>r.id===id?{...r,...changes}:r));
  const patchQc=(id,qchanges)=>saveReqs(reqs.map(r=>r.id===id?{...r,qc:{...(r.qc||{}),...qchanges}}:r));
  return <div>
    <Header title="QC Form" sub="Reviewer section — edit gates inline or open a full review."/>
    <div className="toolbar">
      <div className="search"><Search size={16}/><input placeholder="Search ticket or campaign…" value={q} onChange={e=>setQ(e.target.value)}/></div>
      <select className="select sm" value={fOut} onChange={e=>setFO(e.target.value)}><option value="">All outcomes</option>{OPTIONS.reviewOutcome.map(b=><option key={b}>{b}</option>)}</select>
      <select className="select sm" value={fBy} onChange={e=>setFBy(e.target.value)}><option value="">All reviewers</option>{OPTIONS.cad.map(b=><option key={b}>{b}</option>)}</select>
      <button className={"toggle"+(fFast?" on":"")} onClick={()=>setFF(!fFast)} style={{padding:"8px 12px"}}><Zap size={14}/> Fast-lane</button>
      <span className="count">{filtered.length} of {reqs.length}</span>
    </div>
    <div className="card no-pad"><div className="table-wrap"><table className="table big">
      <thead><tr><th>Ticket</th><th>Campaign</th><th>Deadline</th><th>Content</th><th>Visual</th><th>Brand</th><th>Technical</th><th>Final</th><th>Fast-lane</th><th>Reviewed by</th><th>Outcome</th><th></th></tr></thead>
      <tbody>{filtered.map(r=>{const qc=r.qc||{}; return <tr key={r.id}>
        <td className="mono">{r.ticketNo}</td><td className="ellip" title={r.campaign}>{r.campaign}</td><td>{fmt(r.dueDate)}</td>
        {["content","visual","brand","technical","finalCheck"].map(k=><td key={k}><InlineSelect value={qc[k]==="—"?"":qc[k]} opts={["OK","Issue"]} onChange={v=>patchQc(r.id,{[k]:v||"—"})} color={qc[k]==="OK"?"#0e9f6e":qc[k]==="Issue"?"#e8a33d":null}/></td>)}
        <td><button className={"toggle sm"+(qc.urgentFastLane?" on":"")} style={{padding:"5px 9px",fontSize:12}} onClick={()=>patchQc(r.id,{urgentFastLane:!qc.urgentFastLane})}><Zap size={12}/>{qc.urgentFastLane?"Yes":"No"}</button></td>
        <td><InlineSelect value={r.reviewBy} opts={OPTIONS.cad} onChange={v=>patch(r.id,{reviewBy:v})}/></td>
        <td><InlineSelect value={r.reviewOutcome} opts={OPTIONS.reviewOutcome} onChange={v=>patch(r.id,{reviewOutcome:v})} color={OUTCOME_COLORS[r.reviewOutcome]}/></td>
        <td className="actions"><button className="btn btn-ghost sm" onClick={()=>setOpen(r)}><ClipboardCheck size={14}/> Review</button></td>
      </tr>;})}{filtered.length===0&&<tr><td colSpan={12} className="empty">No tickets match.</td></tr>}</tbody>
    </table></div></div>
    {open&&<QcModal rec={open} onClose={()=>setOpen(null)} onSave={(rec)=>{saveReqs(reqs.map(r=>r.id===rec.id?rec:r)); setOpen(null);}}/>}
  </div>;
}
function QcModal({rec,onClose,onSave}){
  const { options:OPTIONS,user }=useApp();
  const [qc,setQc]=useState(rec.qc||{content:"—",visual:"—",brand:"—",technical:"—",finalCheck:"—",urgentFastLane:false,link:"",reviewDate:""});
  const [outcome,setOutcome]=useState(rec.reviewOutcome||""),[by,setBy]=useState(rec.reviewBy||user.cad||"");
  const setK=(k,v)=>setQc(p=>({...p,[k]:v}));
  const gates=[["content","Content"],["visual","Visual"],["brand","Brand"],["technical","Technical"],["finalCheck","Final check"]];
  return <Modal title={"QC · "+rec.ticketNo} onClose={onClose} wide>
    <div className="qc-banner"><div><div className="qc-camp">{rec.campaign}</div><div className="qc-sub">{rec.brand} · {rec.platform} · {rec.region} · CAD {rec.cad||"unassigned"}</div></div><Badge text={rec.urgency} color={URGENCY_COLORS[rec.urgency]}/></div>
    <div className="form-grid">
      {gates.map(([k,label])=><Field key={k} label={label}><select className="select" value={qc[k]} onChange={e=>setK(k,e.target.value)}>{QC_CHECK.map(o=><option key={o}>{o}</option>)}</select></Field>)}
      <Field label="Urgent fast-lane"><button type="button" className={"toggle"+(qc.urgentFastLane?" on":"")} onClick={()=>setK("urgentFastLane",!qc.urgentFastLane)}><Zap size={14}/> {qc.urgentFastLane?"Yes":"No"}</button></Field>
      <Field label="Review date"><input className="input" type="date" value={qc.reviewDate} onChange={e=>setK("reviewDate",e.target.value)}/></Field>
      <Field label="Reviewed by"><select className="select" value={by} onChange={e=>setBy(e.target.value)}><option value="">Select…</option>{OPTIONS.cad.map(b=><option key={b}>{b}</option>)}</select></Field>
      <Field label="Review outcome"><select className="select" value={outcome} onChange={e=>setOutcome(e.target.value)}><option value="">Select…</option>{OPTIONS.reviewOutcome.map(b=><option key={b}>{b}</option>)}</select></Field>
      <div className="span-2"><Field label="Link for check"><input className="input" value={qc.link} onChange={e=>setK("link",e.target.value)} placeholder="https://…"/></Field></div>
    </div>
    <div className="modal-foot"><button className="btn btn-ghost" onClick={onClose}>Cancel</button><button className="btn btn-primary" onClick={()=>onSave({...rec,qc,reviewOutcome:outcome,reviewBy:by})}>Save review</button></div>
  </Modal>;
}

/* ---------- Insights ---------- */
function Insights(){
  const { reqs,options }=useApp();
  const byKey=(key,opts)=>opts.map(o=>({name:o,value:reqs.filter(r=>r[key]===o).length})).filter(x=>x.value>0);
  const byBrand=byKey("brand",options.brand).sort((a,b)=>b.value-a.value).slice(0,8);
  const byCad=byKey("cad",options.cad).sort((a,b)=>b.value-a.value);
  const byStatus=byKey("status",options.status);
  const byCategory=byKey("category",options.category);
  const sla=reqs.filter(r=>r.urgency==="SLA").length, slaRate=reqs.length?Math.round(sla/reqs.length*100):0;
  const cards=[{label:"Total requests",value:reqs.length,color:"#1f2a44"},{label:"Within SLA",value:slaRate+"%",color:"#0e9f6e"},{label:"Escalated",value:reqs.filter(r=>r.urgency==="Escalated").length,color:"#e8a33d"},{label:"Violated",value:reqs.filter(r=>r.urgency==="Violated").length,color:"#e23b3b"},{label:"Completed",value:reqs.filter(r=>r.status==="Complete").length,color:"#3b6fe2"}];
  const maxB=Math.max(...byBrand.map(b=>b.value),1);
  return <div>
    <Header title="Insights" sub="Where the work is coming from and how the team is keeping up."/>
    <div className="kpi-grid">{cards.map(k=><div key={k.label} className="kpi"><div className="kpi-bar" style={{background:k.color}}/><div className="kpi-num" style={{color:k.color}}>{k.value}</div><div className="kpi-label">{k.label}</div></div>)}</div>
    <div className="grid-2">
      <div className="card"><div className="card-head"><h3>Workload by CAD</h3></div><VBars data={byCad} color="#ff5a3c"/></div>
      <div className="card"><div className="card-head"><h3>Requests by status</h3></div><Donut data={byStatus} colorOf={(n,i)=>STATUS_COLORS[n]||CHART_PALETTE[i%CHART_PALETTE.length]}/></div>
      <div className="card"><div className="card-head"><h3>Top brands</h3></div><div className="status-bars">{byBrand.map(b=><div key={b.name} className="sbar"><div className="sbar-top"><span>{b.name}</span><span className="sbar-n">{b.value}</span></div><div className="sbar-track"><div className="sbar-fill" style={{width:(b.value/maxB*100)+"%",background:"#1f2a44"}}/></div></div>)}</div></div>
      <div className="card"><div className="card-head"><h3>Requests by category</h3></div><Donut data={byCategory} colorOf={(n,i)=>catColor(n,i)}/></div>
    </div>
  </div>;
}

/* ---------- Team ---------- */
function Team(){
  const { users,saveUsers,user,options }=useApp();
  const [add,setAdd]=useState(false);
  const [f,setF]=useState({username:"",name:"",password:"1234",role:"team",cad:""});
  const create=()=>{ if(!f.username||!f.name) return; if(users.find(u=>u.username.toLowerCase()===f.username.toLowerCase())){ window.alert("Username already exists."); return; } saveUsers([...users,{...f,username:f.username.toLowerCase()}]); setAdd(false); setF({username:"",name:"",password:"1234",role:"team",cad:""}); };
  const remove=(un)=>{ if(un===user.username){ window.alert("You can't remove your own account."); return; } if(window.confirm("Remove "+un+"?")) saveUsers(users.filter(u=>u.username!==un)); };
  return <div>
    <Header title="Team" sub="Manage who can sign in and what role they hold." action={<button className="btn btn-primary" onClick={()=>setAdd(true)}><Plus size={16}/> Add member</button>}/>
    <div className="card no-pad"><div className="table-wrap"><table className="table big"><thead><tr><th>Name</th><th>Username</th><th>Role</th><th>CAD</th><th></th></tr></thead><tbody>{users.map(u=><tr key={u.username}><td><span className="who-avatar sm">{u.name[0]}</span>{u.name}</td><td className="mono">{u.username}</td><td><Badge text={u.role==="manager"?"Manager":"Team"} color={u.role==="manager"?"#ff5a3c":"#3b6fe2"}/></td><td>{u.cad||"—"}</td><td className="actions"><button className="icon-btn danger" onClick={()=>remove(u.username)}><Trash2 size={15}/></button></td></tr>)}</tbody></table></div></div>
    {add&&<Modal title="Add team member" onClose={()=>setAdd(false)}><div className="form-grid">
      <Field label="Full name"><input className="input" value={f.name} onChange={e=>setF({...f,name:e.target.value})}/></Field>
      <Field label="Username"><input className="input" value={f.username} onChange={e=>setF({...f,username:e.target.value})} placeholder="lowercase, no spaces"/></Field>
      <Field label="Password"><input className="input" value={f.password} onChange={e=>setF({...f,password:e.target.value})}/></Field>
      <Field label="Role"><select className="select" value={f.role} onChange={e=>setF({...f,role:e.target.value})}><option value="team">Team</option><option value="manager">Manager</option></select></Field>
      <Field label="CAD name"><select className="select" value={f.cad} onChange={e=>setF({...f,cad:e.target.value})}><option value="">Select…</option>{options.cad.map(b=><option key={b}>{b}</option>)}</select></Field>
    </div><div className="modal-foot"><button className="btn btn-ghost" onClick={()=>setAdd(false)}>Cancel</button><button className="btn btn-primary" onClick={create}>Add member</button></div></Modal>}
  </div>;
}

/* ---------- Config ---------- */
const OPT_LABELS={brand:"Brands",category:"Categories",pic:"Names / PIC (CDM)",cad:"CAD (Designers)",region:"Regions",status:"Statuses",urgency:"Urgency levels",platform:"Platforms",output:"Output values",reviewOutcome:"Review outcomes"};
function Config(){
  const { options,setOptions,holidays,setHolidays }=useApp();
  const addItem=(key,val)=>{ val=val.trim(); if(!val||options[key].includes(val)) return; setOptions({...options,[key]:[...options[key],val]}); };
  const removeItem=(key,val)=>setOptions({...options,[key]:options[key].filter(x=>x!==val)});
  return <div>
    <Header title="Config" sub="Edit the dropdown values used across every page, plus public holidays for SLA calculation."/>
    <div className="grid-2">
      {Object.keys(OPT_LABELS).map(key=><div key={key} className="card cfg-sec"><h4>{OPT_LABELS[key]} <span style={{color:"var(--muted)",fontWeight:500}}>({options[key].length})</span></h4><ChipEditor items={options[key]} onAdd={v=>addItem(key,v)} onRemove={v=>removeItem(key,v)}/></div>)}
    </div>
    <div className="card"><div className="card-head"><h3>Public holidays</h3><span className="count">Used for Work days auto-calc &amp; the timeline</span></div><HolidayEditor holidays={holidays} setHolidays={setHolidays} regions={options.region}/></div>
  </div>;
}
function ChipEditor({items,onAdd,onRemove}){
  const [v,setV]=useState("");
  const add=()=>{ onAdd(v); setV(""); };
  return <div className="chips">{items.map(it=><span key={it} className="chip">{it}<button onClick={()=>onRemove(it)}><X size={13}/></button></span>)}<span className="chip-add"><input value={v} onChange={e=>setV(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} placeholder="Add…"/><button className="icon-btn" onClick={add}><Plus size={15}/></button></span></div>;
}
function HolidayEditor({holidays,setHolidays,regions}){
  const [f,setF]=useState({date:"",name:"",region:"TH",type:"Public Holiday"});
  const add=()=>{ if(!f.date||!f.name) return; setHolidays([...holidays,f].sort((a,b)=>a.date.localeCompare(b.date))); setF({date:"",name:"",region:"TH",type:"Public Holiday"}); };
  const remove=(i)=>setHolidays(holidays.filter((_,idx)=>idx!==i));
  return <div>
    <div className="table-wrap"><table className="table"><thead><tr><th>Date</th><th>Name</th><th>Region</th><th>Type</th><th></th></tr></thead><tbody>
      {holidays.map((h,i)=><tr key={i}><td className="mono">{fmt(h.date)}</td><td>{h.name}</td><td>{h.region}</td><td>{h.type}</td><td className="actions"><button className="icon-btn danger" onClick={()=>remove(i)}><Trash2 size={14}/></button></td></tr>)}
      {holidays.length===0&&<tr><td colSpan={5} className="empty">No holidays yet.</td></tr>}
    </tbody></table></div>
    <div className="form-grid" style={{marginTop:16}}>
      <Field label="Date"><input className="input" type="date" value={f.date} onChange={e=>setF({...f,date:e.target.value})}/></Field>
      <Field label="Name"><input className="input" value={f.name} onChange={e=>setF({...f,name:e.target.value})} placeholder="e.g. Songkran"/></Field>
      <Field label="Region"><select className="select" value={f.region} onChange={e=>setF({...f,region:e.target.value})}><option value="ALL">ALL</option>{regions.map(r=><option key={r}>{r}</option>)}</select></Field>
      <Field label="Type"><select className="select" value={f.type} onChange={e=>setF({...f,type:e.target.value})}><option>Public Holiday</option><option>Non Working Day</option></select></Field>
    </div>
    <div className="modal-foot"><button className="btn btn-primary" onClick={add}><Plus size={15}/> Add holiday</button></div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
